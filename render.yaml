services:
  - type: web
    name: saksham-api
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/varuntutejaa/Saksham
    rootDir: server
    branch: main
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string — set manually, not a Render-managed DB
