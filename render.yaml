services:
  - type: web
    name: saksham-api
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/varuntutejaa/Saksham
    rootDir: server
    branch: main
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: saksham-postgres
          property: connectionString

databases:
  - name: saksham-postgres
    plan: free
    region: singapore
    databaseName: saksham
    user: saksham
