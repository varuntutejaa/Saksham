services:
  - type: web
    name: saksham-api
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/varuntutejaa/Saksham
    rootDir: server
    branch: main
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    # Runs once per actual deploy — NOT on every cold-start wake from the free
    # plan's spin-down. Pushing schema + reseeding here (rather than in
    # startCommand) is what keeps a cold-start wake fast: it used to re-run
    # the full ~1,300-row NSQF + 2,300-row PM-AJAY-course + RAG-chunk seed
    # every time the service woke from idle, turning a 30s Render cold start
    # into several minutes.
    preDeployCommand: npm run prisma:push && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string — set manually, not a Render-managed DB
