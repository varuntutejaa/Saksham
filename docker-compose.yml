services:
  db:
    image: postgres:16-alpine
    container_name: saksham-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saksham
    ports:
      - "5432:5432"
    volumes:
      - saksham-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saksham-db-data:
